name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Type check
        run: python -m mypy

      # The model client is mocked throughout, so no Ollama instance is needed.
      - name: Tests
        run: python -m pytest -q

  frontend:
    name: Frontend (lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  images:
    name: Docker images (build only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Built, never run and never pushed. Both images carry no catalogue and
      # no index, so a successful build is the whole check: it keeps the two
      # Dockerfiles honest on every push, including from a machine that has no
      # Docker installed.
      - name: Build the API image
        run: docker build -f backend/Dockerfile -t shurta-api .

      - name: Build the web image
        run: docker build -f frontend/Dockerfile -t shurta-web .
