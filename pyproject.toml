[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "shurta"
version = "0.1.0"
description = "Bilingual Arabic/English retrieval-augmented question answering over public Dubai Police service information, running fully locally."
readme = "README.md"
requires-python = "==3.12.*"
license = "MIT"
authors = [{ name = "Ahmad Mustafa" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "numpy>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    # Starlette's test client requires httpx2; the application itself still
    # uses httpx, which is why both appear.
    "httpx2>=2.16",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["shurta*"]

# The hand-written sections of the answer report are inlined by the report
# generator, so they travel with it rather than sitting in eval/ beside the
# generated file.
[tool.setuptools.package-data]
"shurta.evaluation" = ["notes/*.md"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "B",    # bugbear
    "UP",   # pyupgrade
    "C4",   # comprehensions
    "SIM",  # simplify
    "RUF",  # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
# Arabic test fixtures and normalisation tables are clearer with literal characters.
"backend/tests/*" = ["RUF001", "RUF002", "RUF003"]
"backend/shurta/arabic.py" = ["RUF001", "RUF002", "RUF003"]
# The prompts are written in Arabic, including Arabic-Indic numerals in the
# numbered rules, which the ambiguous-character rules flag by design.
"backend/shurta/prompting.py" = ["RUF001", "RUF002", "RUF003", "E501"]
"backend/shurta/guardrails.py" = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
files = ["backend/shurta"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "shurta.*"
disallow_any_explicit = false

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]
